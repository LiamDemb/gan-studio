project_name: dev-proj
data:
    target_size: 1024
    format: png
    build_id: "001"
    dedup:
        exact: true
        perceptual_threshold: 4
training:
    model_id: "dev"
    batch_size: 4
    microbatch: 2
    num_train_steps: 10000
    num_workers: 4
    precision: bf16
    mirror: true
    compile_main: false
    cache_npy: false
generate:
    catalog_id: "001"
    catalog_size: 64
    trunc_psi: 0.7
    interp_id: "walk-01"
    keyframes: [0, 1, 2, 3, 4]
    frames_per_leg: 48
    fps: 24
    video_name: "walk-01"

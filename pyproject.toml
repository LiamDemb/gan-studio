[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gan-studio"
version = "0.1.0"
description = "Workspace for creating generative adversarial network art"
requires-python = ">=3.11"
dependencies = [
    "pillow==12.3.0",
    "PyYAML==6.0.3",
    "ImageHash==4.3.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "cuda: requires an NVIDIA CUDA device and Triton",
]
